; Exportní presety hry Coin-Picker (Godot 4.7).
;
; PROČ TU JE: `ci.yml` kroky „Export buildů“ volá presety JMÉNEM
; (`--export-release "Linux"` a `--export-release "Web"`). Když soubor v repu
; chybí, export spadne — a protože je to POSLEDNÍ krok CI, projeví se to až po
; všech branách (naměřeno 12. 10. 2026 na prvním běhu této hry: testy, schéma,
; assety, zapojení i vizuální kontrola zelené, ale CI červené na exportu).
;
; Cesty k výstupům se při exportu předávají z příkazové řádky, tady jsou jen
; výchozí hodnoty. Šablony se hledají v export_templates Godotu.
;
; `include_filter` je PODSTATNÝ: mapa úrovně je obyčejný JSON, ne importovaný
; resource — bez filtru by se do buildu nedostala a exportovaná hra by mapu
; nenašla (přitom v CI by všechno vypadalo zeleně).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/levels/*.json"
exclude_filter=""
export_path="build/windows/game.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

